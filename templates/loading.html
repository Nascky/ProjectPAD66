<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerando Defesa...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        #timer { font-size: 36px; margin-top: 20px; color: #0e5ec6; }
        #posicao { font-size: 22px; margin-top: 10px; font-weight: bold; }
        .ads { margin: 40px 0; }

        /* Spinner animado */
        .spinner {
            margin: 30px auto 10px auto;
            width: 50px;
            height: 50px;
            border: 6px solid #eee;
            border-top: 6px solid #0e5ec6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Bolinhas animadas */
        .dots {
            display: inline-block;
            margin-left: 5px;
            font-size: 32px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <h2>Procurando os melhores fundamentos jurídicos para sua defesa...</h2>
    <div class="spinner"></div>

    <div id="frase-loading">
        Estamos vasculhando o RDBM, POP e a legislação administrativa<span class="dots">...</span><br>
        Isso pode levar alguns instantes.
    </div>
    <div id="posicao">Verificando sua posição na fila...</div>
    <div id="timer"></div>
    <p>
        Aguarde enquanto sua defesa é elaborada.<br>
        Você pode visualizar os anúncios abaixo enquanto espera.
    </p>
    <div class="ads">
        <!-- Espaço para anúncios (Google AdSense ou outro) -->
        <ins class="adsbygoogle"
            style="display:block"
            data-ad-client="ca-pub-xxxxxxxxxxxx"
            data-ad-slot="xxxxxxxxxx"
            data-ad-format="auto"
            data-full-width-responsive="true"></ins>
        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>

    <script>
        let tempoRestante = 0;
        let timerInterval = null;
        let defesaLiberada = false;
        let tentativas = 0;
        const TENTATIVA_MAXIMA = 40; // 2 minutos (3s x 40 = 120s)

        // Animação das bolinhas ...
        let dotCount = 0;
        setInterval(() => {
            dotCount = (dotCount + 1) % 4;
            document.querySelector('.dots').innerText = '.'.repeat(dotCount) || '.';
        }, 400);

        function atualizaFila() {
            fetch('/fila-posicao')
                .then(res => res.json())
                .then(data => {
                    document.getElementById("posicao").innerText =
                        `Você está na posição ${data.posicao} da fila.`;
                    if (timerInterval === null) {
                        tempoRestante = data.tempo_estimado;
                        iniciaTimer();
                    }
                });
        }

        function iniciaTimer() {
            timerInterval = setInterval(() => {
                document.getElementById("timer").innerText =
                    `Tempo estimado: ${tempoRestante}s`;
                if (tempoRestante <= 0) {
                    clearInterval(timerInterval);
                    checaDefesa();
                }
                tempoRestante--;
            }, 1000);
        }

        function checaDefesa() {
            fetch("/defesa", { method: "POST" })
                .then(res => res.json())
                .then(data => {
                    if (data.ok) {
                        defesaLiberada = true;
                        window.location.href = "/resultado";
                    } else {
                        tentativas++;
                        if (tentativas > TENTATIVA_MAXIMA) {
                            alert('Ocorreu uma demora incomum. Tente novamente mais tarde.');
                            window.location.href = "/";
                        } else {
                            setTimeout(checaDefesa, 3000);
                        }
                    }
                });
        }

        atualizaFila();
        setInterval(atualizaFila, 5000); // Só atualiza a posição na tela a cada 5s

    </script>
</body>
</html>
