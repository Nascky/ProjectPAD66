<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Gerando Defesa - PAD66</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: 'Roboto', sans-serif;
      text-align: center;
      padding: 30px 15px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      color: #38bdf8;
      text-shadow: 0 0 10px #38bdf8;
      animation: glow 3s infinite alternate;
    }

    @keyframes glow {
      0% { color: #38bdf8; text-shadow: 0 0 10px #38bdf8; }
      50% { color: #f472b6; text-shadow: 0 0 20px #f472b6; }
      100% { color: #facc15; text-shadow: 0 0 30px #facc15; }
    }

    .timer {
      font-size: 2.5rem;
      font-weight: bold;
      margin: 20px 0;
      background-color: #1e293b;
      padding: 15px 40px;
      border-radius: 10px;
      border: 2px solid #475569;
      display: inline-block;
    }

    .mensagem {
      margin-top: 25px;
      font-size: 1rem;
      color: #94a3b8;
      min-height: 60px;
    }

    .defesa-box {
      margin-top: 40px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 20px;
      text-align: left;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      white-space: pre-wrap;
      display: none;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.5rem; }
      .timer { font-size: 2rem; padding: 10px 20px; }
      .defesa-box { padding: 15px; }
    }
  </style>
</head>
<body>
  <h1>Gerando sua Defesa... Aguarde</h1>
  <div class="timer" id="timer">05:00</div>
  <div class="mensagem" id="mensagem">Esse projeto é gratuito graças aos nossos patrocinadores… cada visita conta.</div>

  <div class="defesa-box" id="defesa-box">
    {{ defesa }}
  </div>

  <script>
    let totalSeconds = 300;
    const timerEl = document.getElementById('timer');
    const mensagemEl = document.getElementById('mensagem');
    const defesaEl = document.getElementById('defesa-box');

    const frases = [
      // 0–20s: educado
      "Esse projeto é gratuito graças aos nossos patrocinadores… cada visita conta.",
      "Enquanto isso, aproveita pra dar uma respirada. Sua defesa está chegando.",
      "Tudo isso é feito com carinho, pra você não estar sozinho nessa luta.",
      
      // 20–40s: sugestiva
      "Você não pagou nada por essa defesa. Mas alguém pagou.",
      "Toda vez que você usa essa ferramenta, alguém paga a conta.",
      "Quem valoriza projetos gratuitos sabe onde clicar 👇",
      
      // 40–60s+: cobrança emocional
      "Não existe almoço grátis — alguém tá pagando por essa defesa.",
      "Retribuir é simples: visite um dos anúncios exibidos abaixo.",
      "Você já está aproveitando esse serviço gratuito. Que tal agradecer com uma visita?"
    ];

    function atualizarFrase(segundoAtual) {
      if (segundoAtual < 60) {
        mensagemEl.textContent = frases[0 + segundoAtual % 3];
      } else if (segundoAtual < 120) {
        mensagemEl.textContent = frases[3 + segundoAtual % 3];
      } else {
        mensagemEl.textContent = frases[6 + segundoAtual % 3];
      }
    }

    function updateTimer() {
      const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
      const seconds = String(totalSeconds % 60).padStart(2, '0');
      timerEl.textContent = `${minutes}:${seconds}`;
      atualizarFrase(300 - totalSeconds);

      if (totalSeconds > 0) {
        totalSeconds--;
        setTimeout(updateTimer, 1000);
      } else {
        defesaEl.style.display = 'block';
        mensagemEl.textContent = "Sua defesa está pronta. Esperamos que ajude. 💙";
      }
    }

    updateTimer();
  </script>
</body>
</html>
