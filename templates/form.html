<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preencher Relato</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      padding: 20px;
    }
    .form-container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    textarea {
      height: 150px;
    }
    .btn {
      margin-top: 20px;
      background-color: #0e5ec6;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 5px;
      width: 100%;
      font-size: 16px;
    }
    .btn:hover {
      background-color: #09489a;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Preencher dados para gerar defesa</h2>
    <form action="/gerar" method="POST">
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" name="nome" required>

      <label for="id">ID (matrícula)</label>
      <input type="text" id="id" name="id" required>

      <label for="posto">Graduação/Posto</label>
      <input type="text" id="posto" name="posto" required>

      <label for="batalhao">Batalhão</label>
      <input type="text" id="batalhao" name="batalhao" required>

      <label for="tempo_servico">Tempo de serviço (em anos)</label>
      <input type="number" id="tempo_servico" name="tempo_servico" required>

      <label for="elogios">Último elogio</label>
      <input type="text" id="elogios" name="elogios">

      <label for="numero_notificacao">Número da notificação do PAD</label>
      <input type="text" id="numero_notificacao" name="numero_notificacao" required>

      <label for="relato">Relato dos fatos</label>
      <textarea id="relato" name="relato" required></textarea>

      <button type="submit" class="btn">GERAR DEFESA</button>
    </form>
  </div>
</body>
</html>
